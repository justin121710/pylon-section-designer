# 數值回歸測試（tests/）：無頭 Chromium 開啟 index.html 直接驗算；Excel 計算書以 LibreOffice 重算後與網頁比對
name: 數值回歸測試
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui
      - run: npm test
