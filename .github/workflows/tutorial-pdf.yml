# 操作教學與常見問題 PDF 須對應程式與教學原始檔（見 docs/tutorial/check.sh）。
# 只在推送（合併）到 main 時檢查；過期即重建並以 [skip ci] 機器人提交推回 main，並將兩份 PDF 上傳為 artifact。
# 分支提交不附 PDF，以免每個提交讓儲存庫增加約 13 MB。亦可於 Actions 頁面手動執行（workflow_dispatch）。
name: 操作教學 PDF 重建（main）
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tutorial-pdf-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: sh docs/tutorial/check.sh && echo "stale=0" >> "$GITHUB_OUTPUT" || echo "stale=1" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.stale == '1'
        with: {node-version: 22}
      - name: 安裝建置工具
        if: steps.chk.outputs.stale == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui poppler-utils fonts-noto-cjk python3-pil
          cd docs/tutorial && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: 重建 PDF 並推回
        if: steps.chk.outputs.stale == '1'
        run: |
          cd docs/tutorial && node build.js && cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/RC斷面設計工具_操作教學.pdf" "docs/RC斷面設計工具_常見問題.pdf" docs/tutorial/stamp.txt
          git commit -m "重建操作教學與常見問題 PDF [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-pdf
          path: |
            docs/RC斷面設計工具_操作教學.pdf
            docs/RC斷面設計工具_常見問題.pdf
