<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#0b1220; color:#e6edf7;
           font-family: ui-sans-serif,"Noto Sans TC",system-ui,sans-serif; }
    a { color:#38bdf8; } a:hover { color:#7dd3fc; }
    * { box-sizing:border-box; }
    input, select { background:#0d1526; color:#e6edf7; border:1px solid #243352;
      border-radius:6px; padding:7px 10px; font-size:14px; width:100%;
      font-family:inherit; font-variant-numeric:tabular-nums; }
    input:focus, select:focus { outline:2px solid #38bdf8; outline-offset:-1px; }
  </style>
</helmet>

<div style="width:1440px; height:900px; display:flex; flex-direction:column; overflow:hidden">

  <div style="display:flex; align-items:center; gap:8px; padding:10px 16px;
              background:#111a2e; border-bottom:1px solid #243352; flex-shrink:0">
    <div style="font-weight:800; font-size:17px">RC 斷面設計工具</div>
    <div style="font-size:11.5px; color:#93a4c2">土木401 + 公路橋梁耐震設計規範　｜　kgf-cm 制</div>
    <div style="flex-grow:1"></div>
    <div style="padding:6px 12px; font-size:13px; border:1px solid #243352; border-radius:6px; background:#16213a; color:#93a4c2">略過設定，直接看結果 →</div>
  </div>

  <!-- 步驟條 -->
  <div style="padding:18px 40px 0; flex-shrink:0">
    <div style="display:flex; align-items:flex-start; gap:0">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div onClick="{{ s.pick }}" style="flex-grow:1; cursor:pointer; position:relative">
          <div style="display:flex; align-items:center; gap:0">
            <div style="{{s.lineL}}"></div>
            <div style="{{s.dot}}">{{s.mark}}</div>
            <div style="{{s.lineR}}"></div>
          </div>
          <div style="text-align:center; margin-top:7px; font-size:12.5px; {{s.labelStyle}}">{{s.label}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- 內容 -->
  <div style="display:grid; grid-template-columns:1fr 430px; gap:24px; padding:26px 40px 20px;
              flex-grow:1; min-height:0">

    <div style="display:flex; flex-direction:column; min-height:0">
      <div style="font-size:22px; font-weight:800; letter-spacing:.01em">{{title}}</div>
      <div style="font-size:13px; color:#93a4c2; margin-top:5px; line-height:1.6">{{lede}}</div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px 28px; margin-top:24px">
        <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
          <div style="{{f.span}}">
            <div style="display:flex; align-items:baseline; gap:8px; margin-bottom:5px">
              <div style="font-size:13.5px; font-weight:600">{{f.label}}</div>
              <div style="font-size:12px; color:#93a4c2">{{f.unit}}</div>
            </div>
            <sc-if value="{{f.isSelect}}" hint-placeholder-val="{{ false }}">
              <select><option>{{f.val}}</option></select>
            </sc-if>
            <sc-if value="{{f.isInput}}" hint-placeholder-val="{{ true }}">
              <input value="{{f.val}}">
            </sc-if>
            <div style="font-size:11.5px; margin-top:5px; line-height:1.55; {{f.hintColor}}">{{f.hint}}</div>
          </div>
        </sc-for>
      </div>

      <div style="flex-grow:1"></div>

      <div style="display:flex; align-items:center; gap:10px; padding-top:18px; border-top:1px solid #243352">
        <div onClick="{{ prev }}" style="padding:9px 18px; font-size:13.5px; border:1px solid #243352;
             border-radius:6px; background:#16213a; cursor:pointer">← 上一步</div>
        <div style="flex-grow:1"></div>
        <div style="font-size:12.5px; color:#93a4c2">第 {{stepNo}} / 6 步</div>
        <div onClick="{{ next }}" style="padding:9px 22px; font-size:13.5px; border:1px solid #0284c7;
             border-radius:6px; background:#0369a1; font-weight:600; cursor:pointer">{{nextLabel}}</div>
      </div>
    </div>

    <!-- 右：即時預覽 -->
    <div style="display:flex; flex-direction:column; gap:14px; min-height:0">
      <div style="background:#111a2e; border:1px solid #243352; border-radius:10px; padding:14px">
        <div style="font-size:12px; color:#93a4c2; margin-bottom:9px">目前斷面</div>
        <svg viewBox="0 0 380 236" style="width:100%; display:block">
          <rect x="126" y="12" width="128" height="180" fill="#334155" stroke="#64748b" stroke-width="2"/>
          <rect x="146" y="32" width="88" height="140" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
          <g fill="#f8fafc">
            <circle cx="133" cy="19" r="2.2"/><circle cx="153" cy="19" r="2.2"/><circle cx="173" cy="19" r="2.2"/>
            <circle cx="193" cy="19" r="2.2"/><circle cx="213" cy="19" r="2.2"/><circle cx="233" cy="19" r="2.2"/><circle cx="247" cy="19" r="2.2"/>
            <circle cx="133" cy="185" r="2.2"/><circle cx="153" cy="185" r="2.2"/><circle cx="173" cy="185" r="2.2"/>
            <circle cx="193" cy="185" r="2.2"/><circle cx="213" cy="185" r="2.2"/><circle cx="233" cy="185" r="2.2"/><circle cx="247" cy="185" r="2.2"/>
            <circle cx="133" cy="55" r="2.2"/><circle cx="133" cy="94" r="2.2"/><circle cx="133" cy="133" r="2.2"/>
            <circle cx="247" cy="55" r="2.2"/><circle cx="247" cy="94" r="2.2"/><circle cx="247" cy="133" r="2.2"/>
          </g>
          <rect x="129" y="15" width="122" height="174" fill="none" stroke="#38bdf8" stroke-width="1.3" rx="2"/>
          <rect x="143" y="29" width="94" height="146" fill="none" stroke="#38bdf8" stroke-width="1.1" stroke-dasharray="5 3" rx="2"/>
          <line x1="126" y1="212" x2="254" y2="212" stroke="#93a4c2" stroke-width="1"/>
          <text x="190" y="228" fill="#93a4c2" font-size="11" text-anchor="middle" font-family="ui-sans-serif,system-ui">B = 600 cm</text>
        </svg>
      </div>

      <div style="background:#111a2e; border:1px solid #243352; border-radius:10px; padding:14px;
                  flex-grow:1; min-height:0">
        <div style="font-size:12px; color:#93a4c2; margin-bottom:10px">這一步影響什麼</div>
        <sc-for list="{{impacts}}" as="p" hint-placeholder-count="3">
          <div style="display:flex; gap:9px; padding:7px 0; border-bottom:1px dashed #243352">
            <div style="width:5px; height:5px; border-radius:50%; margin-top:6px; flex-shrink:0; {{p.dot}}"></div>
            <div>
              <div style="font-size:13px">{{p.k}}</div>
              <div style="font-size:11.5px; color:#93a4c2; margin-top:2px; line-height:1.5">{{p.v}}</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { step: 3 }; }

  data(){
    return [
      { label:'斷面幾何', title:'斷面幾何', lede:'先定外形。壁厚會限制主筋能不能排雙層，工具會即時擋。',
        fields:[
          ['斷面型式','','中空箱型',1,'實心矩形 / 中空箱型','d'],
          ['外寬 B','cm','600',0,'','d'],
          ['外高 H','cm','800',0,'','d'],
          ['壁厚 t_w','cm','90',0,'需容納 外保護層 + 箍筋 + 雙層主筋 ≈ 25 cm','d'],
          ['外側保護層','cm','7.5',0,'橋塔外露面慣用 7.5；海洋環境 10','d'],
          ['內側保護層','cm','5.0',0,'','d']
        ],
        impacts:[['A_g = 219,600 cm²','外形決定毛斷面積與慣性矩','ok'],
                 ['雙層主筋可行','t_w = 90 cm 足以容納內外兩層','ok']] },

      { label:'材料', title:'材料強度', lede:'β₁ 與 E_c 由 f′_c 自動導出，不需另外輸入。',
        fields:[
          ["混凝土 f'_c",'kgf/cm²','420',0,'β₁ = 0.750　·　E_c = 307,409　·　≈ 41.2 MPa','a'],
          ['主筋 f_y','kgf/cm²','4200',1,'SD420 / SD490','d'],
          ['橫向筋 f_yt','kgf/cm²','4200',1,'','d'],
          ['ε_cu 極限壓應變','','0.003',0,'非圍束；圍束值由 Mander 另算','d']
        ],
        impacts:[['ε_ty = 0.00206','f_y / E_s，決定 φ 過渡起點','ok']] },

      { label:'主筋', title:'主筋配置', lede:'箱壁內外雙層均佈。內層自動對齊外層座標網格，確保繫筋垂直穿過壁厚。',
        fields:[
          ['主筋號數','','#11 (D36)',1,'#4 ~ #18（CNS 560）','d'],
          ['B 向每面根數','根','39',0,'中心距 15.2 cm　·　淨距 11.6 cm ✓','o'],
          ['H 向每面根數','根','53',0,'中心距 15.0 cm　·　淨距 11.4 cm ✓','o'],
          ['內層同配置','','是（雙層）',1,'','d']
        ],
        impacts:[['ρ_g = 1.504 %','落在 1.0 ~ 4.0 % 之間','ok'],
                 ['共 328 根，A_st = 3,303 cm²','','d'],
                 ['h_x = 30.4 cm','被支撐筋中心距，上限 35 cm','ok']] },

      { label:'橫向筋 / 耐震', title:'橫向鋼筋與耐震設定', lede:'這一步有一個規範讀法有歧義的開關，請對照條文確認。',
        fields:[
          ['箍筋 / 繫筋號數','','#6 (D19)',1,'','d'],
          ['此斷面為塑鉸區','','是',1,'塑鉸區 V_c 折減、間距須加密','w'],
          ['超強係數 φ_o','','1.25',0,'容量設計剪力 V_e = φ_o·M_n / L_v','d'],
          ['剪力跨度 L_v','cm','4000',0,'','d'],
          ['繫筋配置','','規範最低（每隔一根）',1,'切成「每一根」可讓 A_sh 需求的間距從 7.6 放寬到 8.2 cm','d'],
          ['A_sh 之 b_c 配對','','垂直（肢的跨距）',1,'⚠ 規範對 b_c 方向敘述有歧義，箱型牆片兩種讀法差 7 倍以上。垂直＝肢分布的跨距（有圍束壓力比的物理意義）；平行＝量至肢外緣的字面讀法。','w']
        ],
        impacts:[['V_c = 0（塑鉸歸零）','N_u = 2,800 < 0.1f′_c·A_g = 9,223 tf','warn'],
                 ['A_sh 為控制項','箍筋間距由圍束需求決定，非剪力','warn']] },

      { label:'規範係數', title:'規範強度折減係數', lede:'預設為土木401。φ_v = 0.75 是搭配 ACI 型 V_c 校準的，勿換成 AASHTO 的 0.90。',
        fields:[
          ['φ_c 壓力控制','','0.65',0,'土木401 橫箍柱','d'],
          ['φ_t 拉力控制','','0.90',0,'','d'],
          ['φ_v 剪力 / 扭矩','','0.75',0,'AASHTO 的 0.90 是為 MCFT 校準，套在此處會偷掉 20% 裕度','w'],
          ['軸力截斷','×P_o','0.80',0,'橫箍柱','d']
        ],
        impacts:[['φ 過渡','φ_c + (φ_t−φ_c)(ε_t−ε_ty)/(0.005−ε_ty)','d']] },

      { label:'載重組合', title:'載重組合', lede:'可貼上分析輸出的 CSV。工具自動找控制組合。',
        fields:[
          ['組合數','','4 組',0,'','d'],
          ['輸入方式','','貼上 CSV',1,'名稱, P_u, M_ux, M_uy, V_ux, V_uy, T_u','d']
        ],
        impacts:[['控制組合：最小軸力（拉）','D/C = 0.897','ok'],
                 ['剪力控制：地震 X','V_e = 1,932 tf > V_u = 1,450 tf','warn']] },
    ];
  }

  renderVals(){
    const D = this.data(), si = this.state.step;
    const hintColors = { d:'color:#93a4c2', a:'color:#38bdf8', o:'color:#22c55e', w:'color:#f59e0b' };
    const dotColors  = { ok:'background:#22c55e', warn:'background:#f59e0b', d:'background:#93a4c2' };

    const steps = D.map((g,i) => {
      const done = i < si, cur = i === si;
      const dotBase = 'width:26px; height:26px; border-radius:50%; display:flex; align-items:center;'
        + ' justify-content:center; font-size:12px; font-weight:700; flex-shrink:0;';
      return {
        label:g.label, mark: done ? '✓' : String(i+1),
        pick: () => this.setState({ step:i }),
        dot: dotBase + (cur ? ' background:#0369a1; border:2px solid #38bdf8; color:#fff;'
                            : done ? ' background:#16213a; border:2px solid #22c55e; color:#22c55e;'
                                   : ' background:#0d1526; border:2px solid #243352; color:#93a4c2;'),
        lineL: 'height:2px; flex-grow:1;' + (i===0 ? ' background:transparent;' : (done||cur) ? ' background:#22c55e;' : ' background:#243352;'),
        lineR: 'height:2px; flex-grow:1;' + (i===D.length-1 ? ' background:transparent;' : done ? ' background:#22c55e;' : ' background:#243352;'),
        labelStyle: cur ? 'color:#e6edf7; font-weight:700;' : done ? 'color:#93a4c2;' : 'color:#5b6b8a;'
      };
    });

    const g = D[si];
    return {
      steps, title:g.title, lede:g.lede, stepNo: si+1,
      nextLabel: si===D.length-1 ? '計算並產生報告 →' : '下一步 →',
      prev: () => this.setState({ step: Math.max(0, si-1) }),
      next: () => this.setState({ step: Math.min(D.length-1, si+1) }),
      fields: g.fields.map(f => ({
        label:f[0], unit:f[1], val:f[2],
        isSelect: f[3]===1, isInput: f[3]!==1,
        hint:f[4], hintColor: hintColors[f[5]] || hintColors.d,
        span: (f[4] && f[4].length > 42) ? 'grid-column:1 / -1;' : ''
      })),
      impacts: g.impacts.map(p => ({ k:p[0], v:p[1], dot: dotColors[p[2]] || dotColors.d }))
    };
  }
}
</script>
</body>
</html>
