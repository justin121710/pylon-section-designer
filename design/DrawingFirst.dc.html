<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:#0b1220; color:#e6edf7;
           font-family: ui-sans-serif,"Noto Sans TC",system-ui,sans-serif; }
    a { color:#38bdf8; } a:hover { color:#7dd3fc; }
    * { box-sizing:border-box; }
    input, select { background:#0d1526; color:#e6edf7; border:1px solid #243352;
      border-radius:6px; padding:5px 8px; font-size:13px; width:100%;
      font-family:inherit; font-variant-numeric:tabular-nums; }
    input:focus, select:focus { outline:2px solid #38bdf8; outline-offset:-1px; }
  </style>
</helmet>

<div style="width:1440px; height:900px; display:flex; flex-direction:column; overflow:hidden">

  <div style="display:flex; align-items:center; gap:8px; padding:10px 16px;
              background:#111a2e; border-bottom:1px solid #243352; flex-shrink:0">
    <div style="font-weight:800; font-size:17px">RC 斷面設計工具</div>
    <div style="font-size:11.5px; color:#93a4c2">土木401 + 公路橋梁耐震設計規範　｜　kgf-cm 制</div>
    <div style="flex-grow:1"></div>
    <div style="font-size:12px; color:#93a4c2">點圖上任一標註即可就地改值</div>
    <div style="padding:6px 12px; font-size:13px; border:1px solid #0284c7; border-radius:6px; background:#0369a1">列印 / 存成 PDF</div>
  </div>

  <div style="display:grid; grid-template-columns:1fr 330px; gap:0; flex-grow:1; min-height:0">

    <!-- 圖面 -->
    <div style="position:relative; display:flex; align-items:center; justify-content:center;
                background:#0b1220; min-height:0">

      <svg viewBox="0 0 720 700" style="width:700px; height:680px; display:block">
        <!-- 混凝土 -->
        <rect x="{{g.x}}" y="{{g.y}}" width="{{g.w}}" height="{{g.h}}" fill="#334155" stroke="#64748b" stroke-width="2"/>
        <rect x="{{g.ix}}" y="{{g.iy}}" width="{{g.iw}}" height="{{g.ih}}" fill="#0b1220" stroke="#64748b" stroke-width="2"/>
        <!-- 箍筋 -->
        <rect x="{{g.tx}}" y="{{g.ty}}" width="{{g.tw2}}" height="{{g.th}}" fill="none" stroke="#38bdf8" stroke-width="1.6" rx="3"/>
        <rect x="{{g.ux}}" y="{{g.uy}}" width="{{g.uw}}" height="{{g.uh}}" fill="none" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="6 4" rx="3"/>
        <!-- 主筋 -->
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="24">
          <circle cx="{{b.x}}" cy="{{b.y}}" r="{{b.r}}" fill="#f8fafc"/>
        </sc-for>
        <!-- 繫筋 -->
        <sc-for list="{{ties}}" as="t" hint-placeholder-count="8">
          <line x1="{{t.x1}}" y1="{{t.y1}}" x2="{{t.x2}}" y2="{{t.y2}}" stroke="#f472b6" stroke-width="1.2"/>
        </sc-for>

        <!-- 可點的尺寸標註 -->
        <sc-for list="{{dims}}" as="d" hint-placeholder-count="4">
          <g onClick="{{ d.pick }}" style="cursor:pointer">
            <line x1="{{d.lx1}}" y1="{{d.ly1}}" x2="{{d.lx2}}" y2="{{d.ly2}}" stroke="{{d.color}}" stroke-width="{{d.lw}}"/>
            <line x1="{{d.e1x1}}" y1="{{d.e1y1}}" x2="{{d.e1x2}}" y2="{{d.e1y2}}" stroke="{{d.color}}" stroke-width="1"/>
            <line x1="{{d.e2x1}}" y1="{{d.e2y1}}" x2="{{d.e2x2}}" y2="{{d.e2y2}}" stroke="{{d.color}}" stroke-width="1"/>
            <rect x="{{d.bx}}" y="{{d.by}}" width="{{d.bw}}" height="22" rx="5"
                  fill="{{d.chipBg}}" stroke="{{d.color}}" stroke-width="{{d.lw}}"/>
            <text x="{{d.tx}}" y="{{d.ty}}" fill="{{d.textColor}}" font-size="12.5" text-anchor="middle"
                  font-family="ui-sans-serif,system-ui" font-weight="{{d.fw}}">{{d.label}}</text>
          </g>
        </sc-for>
      </svg>

      <!-- 就地編輯氣泡 -->
      <sc-if value="{{editing}}" hint-placeholder-val="{{ true }}">
        <div style="{{pop.pos}}">
          <div style="background:#111a2e; border:1px solid #38bdf8; border-radius:10px; padding:12px 14px;
                      box-shadow:0 12px 34px rgba(0,0,0,.55); width:236px">
            <div style="font-size:12px; color:#93a4c2; margin-bottom:7px">{{pop.title}}</div>
            <div style="display:flex; gap:8px; align-items:center">
              <input value="{{pop.val}}">
              <div style="font-size:12.5px; color:#93a4c2; flex-shrink:0">{{pop.unit}}</div>
            </div>
            <div style="font-size:11.5px; color:#93a4c2; margin-top:8px; line-height:1.5">{{pop.hint}}</div>
            <div style="display:flex; gap:6px; margin-top:11px">
              <div onClick="{{ pop.apply }}" style="flex-grow:1; text-align:center; padding:6px 0; font-size:12.5px;
                   border:1px solid #0284c7; border-radius:6px; background:#0369a1; cursor:pointer; font-weight:600">套用</div>
              <div onClick="{{ pop.close }}" style="padding:6px 12px; font-size:12.5px;
                   border:1px solid #243352; border-radius:6px; background:#16213a; cursor:pointer">取消</div>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- 左下浮動工具 -->
      <div style="position:absolute; left:18px; bottom:18px; display:flex; gap:6px">
        <sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
          <div onClick="{{ t.pick }}" style="{{t.style}}">{{t.label}}</div>
        </sc-for>
      </div>
    </div>

    <!-- 右：非幾何參數 -->
    <div style="background:#111a2e; border-left:1px solid #243352; display:flex;
                flex-direction:column; min-height:0; overflow:hidden">

      <div style="padding:13px 14px; border-bottom:1px solid #243352">
        <select><option>中空箱型 600×800×90（長跨徑橋塔）</option></select>
      </div>

      <div style="padding:13px 14px; border-bottom:1px solid #243352">
        <div style="font-size:12px; color:#93a4c2; margin-bottom:9px">D/C 應力比</div>
        <div style="display:flex; align-items:baseline; gap:8px">
          <div style="font-size:34px; font-weight:800; color:#22c55e; line-height:1;
                      font-variant-numeric:tabular-nums">0.897</div>
          <div style="font-size:12px; color:#93a4c2">最小軸力（拉）控制</div>
        </div>
        <div style="height:5px; background:#0d1526; border-radius:3px; margin-top:10px; overflow:hidden">
          <div style="height:100%; width:89.7%; background:#22c55e"></div>
        </div>
      </div>

      <div style="padding:13px 14px; border-bottom:1px solid #243352">
        <div style="font-size:12px; color:#93a4c2; margin-bottom:8px">材料</div>
        <sc-for list="{{mat}}" as="m" hint-placeholder-count="3">
          <div style="display:grid; grid-template-columns:1fr 104px; align-items:center; gap:8px; margin:6px 0">
            <div style="font-size:13px; color:#93a4c2">{{m.k}}</div>
            <input value="{{m.v}}">
          </div>
        </sc-for>
      </div>

      <div style="padding:13px 14px; border-bottom:1px solid #243352">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:9px">
          <div style="font-size:12px; color:#93a4c2">規範係數</div>
          <div style="flex-grow:1"></div>
          <div onClick="{{ toggleCode }}" style="font-size:11.5px; color:#38bdf8; cursor:pointer">{{codeToggle}}</div>
        </div>
        <sc-if value="{{codeOpen}}" hint-placeholder-val="{{ true }}">
          <sc-for list="{{code}}" as="c" hint-placeholder-count="4">
            <div style="display:grid; grid-template-columns:1fr 74px; align-items:center; gap:8px; margin:6px 0">
              <div style="font-size:13px; color:#93a4c2">{{c.k}}</div>
              <input value="{{c.v}}">
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{codeShut}}" hint-placeholder-val="{{ false }}">
          <div style="font-size:12.5px; color:#93a4c2">土木401 預設　·　φ<sub>c</sub> 0.65　φ<sub>t</sub> 0.90　φ<sub>v</sub> 0.75</div>
        </sc-if>
      </div>

      <div style="padding:13px 14px; flex-grow:1; min-height:0; overflow:hidden">
        <div style="font-size:12px; color:#93a4c2; margin-bottom:8px">警示</div>
        <sc-for list="{{alerts}}" as="a" hint-placeholder-count="3">
          <div style="border-radius:8px; padding:8px 10px; margin-bottom:7px; font-size:12px;
                      line-height:1.5; {{a.style}}">{{a.t}}</div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p){
    super(p);
    this.state = { edit: 'B', codeOpen: false, tool: 0, B: 600, H: 800, tw: 90 };
  }

  renderVals(){
    const S = this.state;
    // 圖面座標：以 720×700 viewBox 置中，依 B/H 等比縮放
    const k = Math.min(300 / S.B, 420 / S.H);
    const w = S.B * k, h = S.H * k, cx = 360, cy = 330;
    const x = cx - w/2, y = cy - h/2, t = S.tw * k;
    const g = {
      x, y, w, h,
      ix: x + t, iy: y + t, iw: Math.max(0, w - 2*t), ih: Math.max(0, h - 2*t),
      tx: x + 7, ty: y + 7, tw2: w - 14, th: h - 14,
      ux: x + t - 6, uy: y + t - 6, uw: Math.max(0, w - 2*t + 12), uh: Math.max(0, h - 2*t + 12)
    };

    // 主筋（示意密度，非全部 328 根）
    const bars = [], nB = 13, nH = 17, r = 2.6;
    for (let i = 0; i < nB; i++) {
      const bx = g.tx + 5 + (g.tw2 - 10) * i / (nB - 1);
      bars.push({ x:bx, y:g.ty + 5, r }, { x:bx, y:g.ty + g.th - 5, r });
    }
    for (let j = 1; j < nH - 1; j++) {
      const by = g.ty + 5 + (g.th - 10) * j / (nH - 1);
      bars.push({ x:g.tx + 5, y:by, r }, { x:g.tx + g.tw2 - 5, y:by, r });
    }
    const ties = [];
    for (let i = 2; i < nB - 1; i += 2) {
      const bx = g.tx + 5 + (g.tw2 - 10) * i / (nB - 1);
      ties.push({ x1:bx, y1:g.ty + 5, x2:bx, y2:g.uy + 6 });
      ties.push({ x1:bx, y1:g.ty + g.th - 5, x2:bx, y2:g.uy + g.uh - 6 });
    }

    // 可點標註
    const D = {
      B:  { title:'外寬 B', unit:'cm', val:String(S.B),  hint:'改變後斷面圖與所有檢核即時重算。' },
      H:  { title:'外高 H', unit:'cm', val:String(S.H),  hint:'H 影響有效深度 d 與 P-M 曲線形狀。' },
      tw: { title:'壁厚 t_w', unit:'cm', val:String(S.tw), hint:'需容納 外保護層 7.5 + 箍筋 + 雙層主筋 ≈ 25 cm。' },
      bar:{ title:'主筋配置', unit:'', val:'#11 ×328', hint:'B 向每面 39 根、H 向每面 53 根，內外雙層。' }
    };
    const chip = (id, label, bx, by, bw) => {
      const on = S.edit === id;
      return {
        id, label,
        pick: () => this.setState({ edit: on ? null : id }),
        color: on ? '#38bdf8' : '#93a4c2',
        textColor: on ? '#e6edf7' : '#93a4c2',
        chipBg: on ? '#0d2438' : '#0f1729',
        lw: on ? 1.8 : 1,
        fw: on ? 700 : 400,
        bx, by, bw, tx: bx + bw/2, ty: by + 15
      };
    };
    const dims = [
      Object.assign(chip('B', 'B = ' + S.B + ' cm', cx - 44, y + h + 44, 88), {
        lx1:x, ly1:y+h+34, lx2:x+w, ly2:y+h+34,
        e1x1:x, e1y1:y+h+6, e1x2:x, e1y2:y+h+40,
        e2x1:x+w, e2y1:y+h+6, e2x2:x+w, e2y2:y+h+40 }),
      Object.assign(chip('H', 'H = ' + S.H + ' cm', x - 128, cy - 11, 88), {
        lx1:x-34, ly1:y, lx2:x-34, ly2:y+h,
        e1x1:x-6, e1y1:y, e1x2:x-40, e1y2:y,
        e2x1:x-6, e2y1:y+h, e2x2:x-40, e2y2:y+h }),
      Object.assign(chip('tw', 't_w = ' + S.tw, x + t + 16, cy - 11, 76), {
        lx1:x, ly1:cy, lx2:x+t, ly2:cy,
        e1x1:x, e1y1:cy-9, e1x2:x, e1y2:cy+9,
        e2x1:x+t, e2y1:cy-9, e2x2:x+t, e2y2:cy+9 }),
      Object.assign(chip('bar', '主筋 #11 ×328', x + w + 26, y + 30, 106), {
        lx1:g.tx+g.tw2-5, ly1:g.ty+5, lx2:x+w+22, ly2:y+41,
        e1x1:x+w+22, e1y1:y+41, e1x2:x+w+26, e1y2:y+41,
        e2x1:x+w+22, e2y1:y+41, e2x2:x+w+22, e2y2:y+41 })
    ];

    const cur = S.edit ? D[S.edit] : null;
    const popPos = { B:'position:absolute; left:50%; bottom:52px; transform:translateX(-50%);',
                     H:'position:absolute; left:40px; top:50%; transform:translateY(-50%);',
                     tw:'position:absolute; left:300px; top:50%; transform:translateY(-50%);',
                     bar:'position:absolute; right:24px; top:96px;' };

    const tools = ['幾何','配筋','載重'].map((label,i) => ({
      label,
      pick: () => this.setState({ tool:i }),
      style: 'padding:7px 15px; font-size:12.5px; border-radius:8px; cursor:pointer;'
        + (i===S.tool ? ' background:#0369a1; border:1px solid #0284c7; color:#fff; font-weight:600;'
                      : ' background:#111a2e; border:1px solid #243352; color:#93a4c2;')
    }));

    return {
      g, bars, ties, dims, tools,
      editing: !!cur, codeOpen: S.codeOpen, codeShut: !S.codeOpen,
      codeToggle: S.codeOpen ? '收合' : '展開',
      toggleCode: () => this.setState({ codeOpen: !S.codeOpen }),
      pop: cur ? Object.assign({}, cur, {
        pos: popPos[S.edit],
        apply: () => this.setState({ edit:null }),
        close: () => this.setState({ edit:null })
      }) : { pos:'', title:'', unit:'', val:'', hint:'', apply:()=>{}, close:()=>{} },
      mat: [{k:"f'_c",v:'420'},{k:'f_y',v:'4200'},{k:'f_yt',v:'4200'}],
      code: [{k:'φ_c',v:'0.65'},{k:'φ_t',v:'0.90'},{k:'φ_v',v:'0.75'},{k:'軸力截斷',v:'0.80'}],
      alerts: [
        { t:'塑鉸區且 N_u < 0.1f′_c·A_g → V_c 取 0，全部剪力由箍筋承擔。',
          style:'background:rgba(245,158,11,.13); border-left:4px solid #f59e0b' },
        { t:'A_sh 為控制項 — 箍筋間距由圍束需求決定，非剪力強度。',
          style:'background:rgba(56,189,248,.11); border-left:4px solid #38bdf8' },
        { t:'主筋淨距 11.6 / 11.4 cm ≥ 需求 5.37 cm。',
          style:'background:rgba(34,197,94,.13); border-left:4px solid #22c55e' }
      ]
    };
  }
}
</script>
</body>
</html>
